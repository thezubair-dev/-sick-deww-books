<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides | By ZUBAIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease; }
        .hidden-content { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
        .show-content { display: block; opacity: 1; transform: translateY(0); }
        
        #audioPopup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%);
            z-index: 2000; width: 90%; max-width: 380px; padding: 32px; border-radius: 2.5rem;
            background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1); display: none; opacity: 0;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        }
        #audioPopup.active { display: block; opacity: 1; transform: translate(-50%, -50%); }
        .popup-btn { padding: 12px 24px; border-radius: 14px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; transition: all 0.3s ease; }
        .btn-emerald { background: #10b981; color: #000; }
        .btn-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="p-6 md:p-16">
    <nav class="max-w-6xl mx-auto mb-16">
        <a href="index.html" class="text-[10px] uppercase tracking-widest opacity-40 hover:opacity-100 flex items-center gap-2">← Back</a>
    </nav>

    <div id="selection-menu" class="max-w-6xl mx-auto">
        <header class="mb-20">
            <h1 class="text-5xl font-black uppercase mb-4">Select <span class="text-emerald-500">Path.</span></h1>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="showLevels()" class="glass p-12 rounded-[3rem] cursor-pointer h-80 flex flex-col justify-between">
                <h2 class="text-3xl font-black uppercase">Islamic Philosophers</h2>
                <p class="text-xs opacity-50 uppercase tracking-widest">3 Levels of Mastery</p>
            </div>
            <div class="glass p-12 rounded-[3rem] opacity-30 h-80 flex items-center justify-center">
                <h2 class="text-2xl font-black uppercase opacity-20">More Coming Soon</h2>
            </div>
        </div>
    </div>

    <div id="levels-content" class="hidden-content max-w-5xl mx-auto pt-10">
        <button onclick="hideLevels()" class="mb-12 text-[10px] font-bold border border-emerald-500/30 px-6 py-2 rounded-full">↑ Close Path</button>
        <div class="space-y-8">
             <div class="glass p-10 rounded-[2.5rem] border-l-4 border-emerald-500">
                <h3 class="font-black text-xl mb-4">Beginner</h3>
                <p class="opacity-60">Ghazali – Deliverance from Error, Beginning of Guidance...</p>
             </div>
        </div>
    </div>

    <div id="audioPopup">
        <h3 class="text-xl font-black mb-2">Take 3 minutes. Listen.</h3>
        <p class="text-xs opacity-50 mb-8 uppercase font-bold">A message worth your attention.</p>
        <div class="flex justify-center gap-4">
            <button id="listenBtn" class="popup-btn btn-emerald">▶ Listen</button>
            <button id="ignoreBtn" class="popup-btn btn-red">Ignore</button>
        </div>
    </div>

    <audio id="modudiAudio" src="https://raw.githubusercontent.com/thezubair-dev/-sick-deww-books/main/modudi.mp3.mpeg"></audio>

    <script>
        const audioPopup = document.getElementById('audioPopup');
        const modudiAudio = document.getElementById('modudiAudio');
        const listenBtn = document.getElementById('listenBtn');
        const ignoreBtn = document.getElementById('ignoreBtn');

        function showLevels() { 
            document.getElementById('selection-menu').style.display = 'none'; 
            document.getElementById('levels-content').classList.add('show-content'); 
        }
        function hideLevels() { 
            document.getElementById('selection-menu').style.display = 'block'; 
            document.getElementById('levels-content').classList.remove('show-content'); 
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                audioPopup.style.display = 'block';
                setTimeout(() => { audioPopup.classList.add('active'); }, 50);
            }, 2000);
        });

        listenBtn.addEventListener('click', () => {
            modudiAudio.play().catch(e => console.error(e));
            closePopup();
        });

        ignoreBtn.addEventListener('click', closePopup);
        function closePopup() {
            audioPopup.classList.remove('active');
            setTimeout(() => { audioPopup.style.display = 'none'; }, 600);
        }
    </script>
</body>
</html>
