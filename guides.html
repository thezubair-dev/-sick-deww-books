<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides | By ZUBAIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass:hover { transform: translateY(-5px); border-color: rgba(16, 185, 129, 0.4); background: rgba(255, 255, 255, 0.04); }
        .hidden-content { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
        .show-content { display: block; opacity: 1; transform: translateY(0); }
        
        /* Fixed Stop Button - Forced Visibility via z-index */
        #stopContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: none; /* Controlled by JS */
        }

        .stop-btn-ui {
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .stop-btn-ui:hover { background: #ef4444; color: white; transform: scale(1.05); }

        .pulse-dot {
            width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="p-6 md:p-16">

    <div id="stopContainer">
        <button onclick="stopMusic()" class="stop-btn-ui">
            <div class="pulse-dot"></div>
            Stop Audio
        </button>
    </div>

    <nav class="max-w-6xl mx-auto mb-16">
        <a href="index.html" class="text-[10px] uppercase tracking-widest opacity-40 hover:opacity-100 flex items-center gap-2">← Back</a>
    </nav>

    <div id="selection-menu" class="max-w-6xl mx-auto">
        <header class="mb-20">
            <h1 class="text-5xl font-black uppercase mb-4">Select <span class="text-emerald-500">Path.</span></h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="startJourney()" class="glass p-12 rounded-[3rem] cursor-pointer group h-80 flex flex-col justify-between">
                <h2 class="text-3xl font-black uppercase tracking-tight mb-2">Islamic Philosophers</h2>
                <p class="text-xs opacity-50 uppercase tracking-widest">3 Levels of Mastery</p>
            </div>
            <div class="glass p-12 rounded-[3rem] opacity-20 h-80 flex items-center justify-center">
                <p class="uppercase font-black tracking-widest">Coming Soon</p>
            </div>
        </div>
    </div>

    <div id="levels-content" class="hidden-content max-w-5xl mx-auto pt-10">
        <button onclick="hideLevels()" class="mb-12 text-[10px] font-bold uppercase tracking-widest text-emerald-500 border border-emerald-500/30 px-6 py-2 rounded-full">↑ Close Path</button>
        <div class="space-y-8">
            <div class="glass p-8 rounded-[2.5rem] border-l-4 border-emerald-500">
                <h3 class="font-black text-xl mb-4 text-emerald-500 uppercase">🔰 Beginner</h3>
                <ul class="space-y-2 opacity-80 font-bold">
                    <li>Ghazali – Deliverance from Error</li>
                    <li>Ghazali – Beginning of Guidance</li>
                </ul>
            </div>
        </div>
    </div>

    <audio id="modudiAudio" preload="auto" crossorigin="anonymous" loop>
        <source src="https://raw.githubusercontent.com/thezubair-dev/-sick-deww-books/main/modudi.mp3.mpeg" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('modudiAudio');
        const stopContainer = document.getElementById('stopContainer');

        function startJourney() {
            // 1. Force the button to show IMMEDIATELY
            stopContainer.style.display = 'block';

            // 2. Attempt to play
            audio.play().catch(e => {
                console.log("Audio failed to play, but button is visible.");
            });

            // 3. Switch UI
            document.getElementById('selection-menu').style.display = 'none';
            document.getElementById('levels-content').classList.add('show-content');
            window.scrollTo(0, 0);
        }

        function stopMusic() {
            audio.pause();
            audio.currentTime = 0;
            stopContainer.style.display = 'none';
        }

        function hideLevels() {
            document.getElementById('selection-menu').style.display = 'block';
            document.getElementById('levels-content').classList.remove('show-content');
        }

        // Preload on load
        window.onload = () => { audio.load(); };
    </script>
</body>
</html>
